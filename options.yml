meta:
  version: 1.0.0
options:
- name: group1
  header: '{{title}}'
  display: UCP2Switch
  category:
  - '{{ai}}'
  - '{{fixes}}'
  children:
  - name: element7
    text: '{{mode}}'
    display: Choice
    url: ai-ox-tethers.oxtethers.mode
    enabled: ai-ox-tethers.oxtethers.enabled
    contents:
      value: use_aic
      choices:
      - name: override_aic
        text: '{{override_aic}}'
      - name: use_aic
        text: '{{use_aic}}'
  - name: initialOxTether
    text: '{{disable_initial}}'
    display: Switch
    contents:
      value: true
    url: ai-ox-tethers.oxtethers.parameters.disableInitialOxTether
    enabled: ai-ox-tethers.oxtethers.enabled
  - name: group_dynamic
    text: '{{help_text}}'
    header: '{{dynamic_title}}'
    enabled: ai-ox-tethers.oxtethers.enabled
    display: UCP2Switch
    children:
    - name: element1
      text: '{{max_total}}'
      display: Number
      url: ai-ox-tethers.oxtethers.parameters.maxOxTethers
      enabled: ai-ox-tethers.oxtethers.logic.dynamic
      contents:
        value: 100
        min: 0
        max: 2000
        step: 1
    - name: element2
      text: '{{max_per_quarry}}'
      display: Number
      url: ai-ox-tethers.oxtethers.parameters.dynamicMaxOxTethers
      enabled: ai-ox-tethers.oxtethers.logic.dynamic
      contents:
        value: 3
        min: 0
        max: 2000
        step: 1
      tooltip: '{{multiplier_help}}'
    - name: element4
      text: '{{max_linked}}'
      display: Number
      url: ai-ox-tethers.oxtethers.parameters.maximumOxTethersPerQuarry
      contents:
        value: 6
        min: 0
        max: 2000
        step: 1
      enabled: ai-ox-tethers.oxtethers.logic.dynamic
    - name: element3
      text: '{{min_linked}}'
      display: Number
      url: ai-ox-tethers.oxtethers.parameters.minimumOxTethersPerQuarry
      contents:
        value: 1
        min: 0
        max: 2000
        step: 1
      enabled: ai-ox-tethers.oxtethers.logic.dynamic
    - name: element5
      text: '{{threshold}}'
      display: Number
      url: ai-ox-tethers.oxtethers.parameters.thresholdStoneLoad
      contents:
        value: 20
        min: 1
        max: 48
        step: 1
      enabled: ai-ox-tethers.oxtethers.logic.dynamic
    url: ai-ox-tethers.oxtethers.logic.dynamic
    contents:
      value: true
  - name: group_advanced
    header: '{{advanced}}'
    enabled: ai-ox-tethers.oxtethers.enabled
    display: GroupBox
    children:
    - name: logging
      header: '{{logging}}'
      hasHeader: true
      text: '{{log_level}}'
      display: UCP2Slider
      contents:
        value:
          enabled: false
          sliderValue: 2
        min: -2
        max: 10
        step: 1
        decimals: 0
      url: ai-ox-tethers.oxtethers.log
      enabled: ai-ox-tethers.oxtethers.enabled
    accordion:
      enabled: true
  text: '{{description}}'
  url: ai-ox-tethers.oxtethers.enabled
  contents:
    value: false
