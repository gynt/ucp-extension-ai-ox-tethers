fixes: رفع اشکال
title: کنترل جایگاه گاو برای هوش مصنوعی
description: نحوهٔ ساخت جایگاه گاو برای معادن سنگ هوش مصنوعی را تنظیم می‌کند.
mode: تنظیمات AIC
override_aic: استفاده از این پیش‌فرض‌ها برای همهٔ هوش‌های مصنوعی
use_aic: اجازهٔ تنظیمات AIC جداگانه برای هر هوش مصنوعی
disable_initial: با ساخت هر معدن سنگ، جایگاه گاو به‌طور خودکار ساخته نشود
dynamic_title: سقف‌های پویا
help_text: هر جایگاه گاو به معدنی مرتبط می‌شود که آخرین بار از آن سنگ برداشته است. اگر تعداد جایگاه‌ها
  کم باشد یا سنگ به‌ازای هر جایگاه از آستانه بگذرد، هوش مصنوعی جایگاه تازه می‌سازد. سقف‌های زیر ساخت بیشتر
  را محدود می‌کنند.
max_total: بیشترین تعداد جایگاه برای هر هوش مصنوعی
max_per_quarry: ضریب سقف کل به‌ازای هر معدن
multiplier_help: سقف کل همچنین به حاصل‌ضرب این مقدار در تعداد معادن محدود می‌شود.
max_linked: بیشترین جایگاه مرتبط با هر معدن
min_linked: کمترین جایگاه مرتبط با هر معدن
threshold: سنگ به‌ازای هر جایگاه پیش از ساخت جایگاه دیگر
advanced: تنظیمات پیشرفته
logging: ثبت تصمیم‌های هوش مصنوعی دربارهٔ جایگاه گاو
log_level: سطح گزارش
ai: هوش مصنوعی
