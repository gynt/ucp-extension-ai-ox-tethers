fixes: 修复
title: AI牛车站控制
description: 设置AI如何为采石场建造牛车站。
mode: AIC设置
override_aic: 所有AI使用这些默认值
use_aic: 允许各AI使用自己的AIC设置
disable_initial: 建造采石场时不自动建造牛车站
dynamic_title: 动态上限
help_text: 每个牛车站关联到它最近一次取石的采石场。如果关联的牛车站太少，或每个牛车站对应的石料量超过阈值，AI就会建造新的牛车站。下方的上限用于限制继续建造。
max_total: 每个AI的牛车站总数上限
max_per_quarry: 每个采石场的总上限乘数
multiplier_help: 总上限还受此值乘以采石场数量的结果限制。
max_linked: 每个采石场的关联牛车站上限
min_linked: 每个采石场的关联牛车站下限
threshold: 增建牛车站所需的每站石料量
advanced: 高级设置
logging: 记录AI建造牛车站的决策
log_level: 日志级别
ai: AI
