dynamic_title: Límites dinámicos
help_text: Cada poste queda vinculado a la cantera de la que recogió piedra por última vez. La IA añade
  postes si una cantera tiene pocos o si la piedra por poste supera el umbral. Los límites de abajo restringen
  la construcción de nuevos postes.
