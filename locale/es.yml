multiplier_help: El límite total tampoco puede superar este valor multiplicado por el número de canteras.
max_linked: Máximo de postes vinculados por cantera
min_linked: Mínimo de postes vinculados por cantera
threshold: Piedra por poste antes de añadir otro
advanced: Ajustes avanzados
logging: Registrar las decisiones de la IA sobre postes
log_level: Nivel de registro
ai: IA
